name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest
        working-directory: backend
      - name: Security scan (bandit; every exception is documented inline)
        run: pip install bandit && python -m bandit -r uata -q
        working-directory: backend

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r backend/requirements.txt
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - name: Widget tests + contract tests against the real engine
        run: flutter test --exclude-tags network
        working-directory: app
        env:
          UATA_BACKEND_DIR: ${{ github.workspace }}/backend

  market-live:
    # live download of real prices (Dukascopy, Binance) + quick start on real data. Runs in parallel and
    # never blocks the builds: an outage of a third-party data service must not turn the pipeline red.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - name: Live market data + quick start on real prices
        run: flutter test --tags network -r expanded
        working-directory: app

  android-build:
    runs-on: ubuntu-latest
    needs: [backend, flutter]
    # Companion app: the engine stays on the computer, so the APK contains no Python.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build APK (companion)
        run: flutter build apk --debug --build-number ${{ github.run_number }} --dart-define=UATA_BUILD=${{ github.run_number }}
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: uata-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  windows-build:
    runs-on: windows-latest
    needs: [backend, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build app, engine, bundled Tesseract and installer
        run: ./scripts/build_windows.ps1 -BundleTesseract -Installer
        shell: pwsh
      - name: Install silently, run the installed engine, check OCR (ara+eng), uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\UATA-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $app = "$env:LOCALAPPDATA\Programs\UATA"
          if (-not (Test-Path "$app\uata_app.exe")) { throw "app not installed" }
          if (-not (Test-Path "$app\engine\uata-engine.exe")) { throw "engine not installed" }
          $env:UATA_DATA_DIR = "$env:RUNNER_TEMP\uata"
          $p = Start-Process -PassThru -FilePath "$app\engine\uata-engine.exe"
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try { $h = Invoke-RestMethod http://127.0.0.1:8765/health; $ok = $true; break } catch {}
          }
          if (-not $ok) { throw "installed engine did not start" }
          $h.capabilities | ConvertTo-Json
          if (-not $h.capabilities.ocr) { throw "bundled OCR not found by the installed engine" }
          if ($h.capabilities.ocr_languages -notcontains "ara") { throw "Arabic OCR data missing" }
          if (-not $h.capabilities.ffmpeg) { throw "bundled ffmpeg missing" }
          Stop-Process -Id $p.Id
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$app\uata_app.exe") { throw "uninstall left the app behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: uata-windows-installer
          path: dist/UATA-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: uata-windows
          path: app/build/windows/x64/runner/Release/
